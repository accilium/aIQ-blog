title: aIQ Blog
tagline: Notes on AI, intelligence, and the systems we build.
description: >-
  aIQ is a blog about artificial intelligence, machine learning, and the
  craft of building reliable AI systems.
author: aIQ
baseurl: "/aIQ-blog"
url: "https://accilium.github.io"

permalink: /:year/:month/:day/:title/

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - node_modules
